<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>实时时间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0b0f19;
    color: #e8eefc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #time {
    font-size: clamp(48px, 18vw, 120px);
    font-weight: 600;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    text-shadow: 0 0 30px rgba(80, 160, 255, 0.35);
  }
  #date {
    margin-top: 16px;
    font-size: clamp(14px, 4.5vw, 22px);
    color: #8fa3c8;
    letter-spacing: 1px;
  }
  #weekday {
    margin-top: 6px;
    font-size: clamp(13px, 4vw, 18px);
    color: #5f7396;
    letter-spacing: 1px;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3ddc84;
    margin-right: 8px;
    vertical-align: middle;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .status {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    font-size: 13px;
    color: #5f7396;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="status"><span class="dot"></span>实时刷新中</div>
  <div id="time">--:--:--</div>
  <div id="date">----年--月--日</div>
  <div id="weekday">星期-</div>

<script>
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const h = pad(now.getHours());
    const m = pad(now.getMinutes());
    const s = pad(now.getSeconds());

    document.getElementById('time').textContent = `${h}:${m}:${s}`;
    document.getElementById('date').textContent =
      `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日`;
    document.getElementById('weekday').textContent = weekdays[now.getDay()];
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
